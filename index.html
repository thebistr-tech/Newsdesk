<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NEWSDESK</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0F3;--panel:#fff;--ink:#141E28;--soft:#5A6875;--line:#D4DAE0;--sig:#D97B29;--ok:#2E7D6B;--upd:#3C6FB0;--dng:#B23A3A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;padding:0 clamp(12px,4vw,48px) 60px}
.mast{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;padding:26px 0 14px;border-bottom:3px solid var(--ink)}
.kick{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:3px;color:var(--sig)}
h1{font-family:'Barlow Condensed';font-weight:700;font-size:clamp(38px,7vw,60px);margin:0;line-height:.95}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--soft)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.day{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--soft);cursor:pointer}
.day.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 20px;margin:16px 0}
.ph{font-family:'Barlow Condensed';font-weight:600;letter-spacing:2px;font-size:15px;color:var(--soft);margin-bottom:8px}
.digest{font-size:16px;line-height:1.6;max-width:72ch;margin:0 0 14px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.dcard{border:1px solid var(--line);border-left:3px solid var(--sig);border-radius:4px;padding:10px 14px;background:var(--bg);font-size:13px;line-height:1.5}
.dname{font-family:'Barlow Condensed';font-weight:600;letter-spacing:1px;margin-bottom:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
select{padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font-family:'IBM Plex Mono',monospace;font-size:12px}
.card{display:flex;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:15px 18px;margin-bottom:12px}
.urg{display:flex;flex-direction:column;gap:3px;padding-top:4px}.useg{width:8px;height:12px;border-radius:2px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.badge{color:#fff;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;padding:3px 7px;border-radius:3px}
.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--soft)}
.mm{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--soft)}
h2{font-family:'Barlow Condensed';font-weight:600;font-size:23px;line-height:1.1;margin:0 0 4px}
h2 a{color:inherit;text-decoration:none}h2 a:hover{text-decoration:underline}
.upof{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--upd);margin-bottom:4px}
.sum{font-size:14px;line-height:1.55;color:#2A3540;margin:4px 0 10px;max-width:80ch}
.foot{display:flex;align-items:center;gap:10px;font-size:12px}
.q{letter-spacing:2px;color:var(--sig)}.q .off{color:var(--line)}
.empty{text-align:center;color:var(--soft);padding:44px 0;font-family:'IBM Plex Mono',monospace;font-size:13px}
footer{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--soft);margin-top:40px}
</style></head><body>
<header class="mast"><div><div class="kick">KEYWORD MONITORING DESK — AUTO-UPDATED DAILY</div><h1>NEWSDESK</h1></div>
<div class="mono" id="lastscan"></div></header>
<nav class="tabs" id="tabs"></nav>
<section class="panel" id="digestPanel" style="display:none"><div class="ph" id="dtitle"></div><p class="digest" id="doverall"></p><div class="dgrid" id="dgrid"></div></section>
<div class="filters"><select id="fProj"><option value="all">All projects</option></select>
<select id="fStatus"><option value="all">New + updates</option><option value="new">New only</option><option value="update">Updates only</option></select>
<span style="flex:1"></span>
<select id="fSort"><option value="urgency">Sort: urgency</option><option value="quality">Sort: source quality</option><option value="recent">Sort: newest</option></select></div>
<main id="feed"></main>
<footer>scans run automatically every morning · urgent items (4-5) are pushed to Telegram · archive keeps 21 days</footer>
<script>
const DATA={"articles":[{"id":"94sr0wu7","projectId":"p-mirilashvili","projectName":"Mirilashvili","scanDate":"2026-08-12","title":"Second Authority Regulator's Representative Concealed Post-Appointment Meetings with Communications Minister Kara'i","source":"העין השביעית (The Seventh Eye)","url":"https://www.the7eye.org.il/591954","published":"2026-08-11","topic":"Regulatory conflict","urgency":4,"quality":3,"status":"update","updateOf":"Legal Exemption Expired: How Will the Second Authority Act Against Mirilashvili's Dual Media Holdings?","summary":"A freedom-of-information request reveals that Yoni Shemoni — Communications Minister Kara'i's appointee on the Second Authority council, the body that must rule on Mirilashvili's illegal cross-ownership — held two meetings with Kara'i after his appointment while publicly denying any contact, raising serious conflict-of-interest questions about the regulator's independence."},{"id":"1jqxmrbo","projectId":"p-mirilashvili","projectName":"Mirilashvili","scanDate":"2026-08-12","title":"Israeli Press Front Pages (12.8.2026): Mirilashvili Cross-Ownership Issue Leads Fourth Consecutive Day","source":"העין השביעית (The Seventh Eye)","url":"https://www.the7eye.org.il/592061","published":"2026-08-12","topic":"Media ownership","urgency":2,"quality":3,"status":"update","updateOf":"Israeli Press Front Pages (11.8.2026): Mirilashvili Cross-Ownership Issue Leads Third Consecutive Day","summary":"The 12 August 2026 daily press-front-page roundup again leads with the lapsed exemption permitting Yitzhak Mirilashvili to hold Channel 14 and Kol Chai simultaneously, marking a fourth consecutive day the story dominates Israeli newspaper front pages with no Second Authority decision yet announced."},{"id":"lih4u6iz","projectId":"p-georgescu","projectName":"Calin Georgescu","scanDate":"2026-08-12","title":"Newsweek Publishes Opinion Calling on US to Defend Democracy and Georgescu in Romania","source":"Newsweek","url":"https://www.newsweek.com/the-us-should-defend-democracy-and-calin-georgescu-in-romania-opinion-12310211","published":"2026-08-11","topic":"International Opinion","urgency":3,"quality":4,"status":"new","updateOf":null,"summary":"A Newsweek opinion piece by London-based writer Dennis Portman argues the US should publicly defend the democratic rights of the nine million Romanians who voted in 2024 and challenge Romania's election annulment process, framing it as a NATO security concern."},{"id":"stwasq9o","projectId":"p-georgescu","projectName":"Calin Georgescu","scanDate":"2026-08-12","title":"The Diplomatic Affairs: Newsweek Entry Into Romanian Debate Signals Growing Western Attention to Georgescu Case","source":"The Diplomatic Affairs","url":"https://www.thediplomaticaffairs.com/2026/08/11/newsweek-calin-georgescu/","published":"2026-08-11","topic":"International Commentary","urgency":2,"quality":2,"status":"new","updateOf":null,"summary":"Analysis piece notes that Newsweek's August 11 editorial calling on Washington to defend Georgescu's voters marks a significant escalation of Western media attention to Romania's election annulment controversy."},{"id":"mdmck28t","projectId":"p-georgescu","projectName":"Calin Georgescu","scanDate":"2026-08-12","title":"Coup-Plot File Formally Returns to Bucharest Court of Appeal for Merits Hearing Scheduling","source":"Romania TV / News.ro","url":"https://www.romaniatv.net/iccj-a-respins-toate-contestatiile-din-dosarul-calin-georgescu-horatiu-potra-incepe-judecata-de-fond-in-procesul-privind-tentativa-de-lovitura-de-stat_9739255.html","published":"2026-08-10","topic":"Trial Procedure","urgency":3,"quality":3,"status":"update","updateOf":"Bucharest Court of Appeal Now Empowered to Schedule First Substantive Hearing in Georgescu-Potra Coup Case","summary":"Following the ICCJ's Aug 6 definitive ruling, the Georgescu-Potra coup-attempt dossier has formally been returned to the Bucharest Court of Appeal, which will now set concrete hearing dates and begin administering evidence."},{"id":"xacelprp","projectId":"p-ortagus","projectName":"Morgan Ortagus","scanDate":"2026-08-12","title":"House Bipartisan Group Introduces Graham Sanctions Companion Bill During Recess, Teeing Up Fall Vote","source":"RFE/RL","url":"https://www.rferl.org/a/33826098.html","published":"2026-08-11","topic":"Sanctions legislation","urgency":4,"quality":4,"status":"update","updateOf":"House Russia-Iran Sanctions Vote Pushed to September as Congress Enters Recess","summary":"Despite the House remaining in August recess, Reps. McCaul, Fitzpatrick, Hoyer and 16 colleagues introduced an identical companion to the Senate-passed Graham sanctions bill on Aug. 10, accelerating momentum toward a fall floor vote and complicating the earlier framing that action was simply deferred to September."},{"id":"80a61s7i","projectId":"p-ortagus","projectName":"Morgan Ortagus","scanDate":"2026-08-12","title":"Trump's Iran Tariff Demand Looms as Key Obstacle for Graham Sanctions Bill in the House","source":"The Hill","url":"https://thehill.com/homenews/house/6021244-house-bipartisan-russia-sanctions-bill/","published":"2026-08-11","topic":"Sanctions/tariffs","urgency":4,"quality":4,"status":"new","updateOf":null,"summary":"House aides warn that Trump's standing demand to add Iran tariff authority to the Graham Act — which Democrats already oppose — is the central fault line that could prevent passage under suspension rules requiring a two-thirds majority."},{"id":"ttyftzwr","projectId":"p-ortagus","projectName":"Morgan Ortagus","scanDate":"2026-08-12","title":"SC Senate Special Primary Forces Aug. 25 Runoff Between Darline Graham and Ralph Norman","source":"ABC News","url":"https://abcnews.com/Politics/south-carolina-special-senate-primary-election-results/story?id=135122764","published":"2026-08-11","topic":"Graham succession","urgency":3,"quality":4,"status":"new","updateOf":null,"summary":"No candidate cleared a majority in last night's South Carolina GOP special primary to replace the late Sen. Lindsey Graham, sending Trump-endorsed appointed Sen. Darline Graham and Rep. Ralph Norman to an Aug. 25 runoff — leaving uncertain who will champion the Graham sanctions act's Senate legacy in the new term."},{"id":"bn7gmgx0","projectId":"p-mirilashvili","projectName":"Mirilashvili","scanDate":"2026-08-13","title":"Israeli Press Front Pages (13.8.2026): Mirilashvili Cross-Ownership Issue Leads Fifth Consecutive Day","source":"העין השביעית (The Seventh Eye)","url":"https://www.the7eye.org.il/592133","published":"2026-08-13","topic":"Media regulation","urgency":3,"quality":3,"status":"update","updateOf":"Israeli Press Front Pages (12.8.2026): Mirilashvili Cross-Ownership Issue Leads Fourth Consecutive Day","summary":"The Seventh Eye's daily press-digest confirms the Mirilashvili dual-ownership story headlines Israeli papers for a fifth straight day, alongside the ongoing story of the Second Authority representative concealing meetings with Minister Karhi."},{"id":"bt21rb6s","projectId":"p-mirilashvili","projectName":"Mirilashvili","scanDate":"2026-08-13","title":"Second Authority Grants Channel 14 New Reprieve on Jerusalem Broadcast Requirement Until End of August","source":"אייס (ice.co.il)","url":"https://www.ice.co.il/tv/news/article/1124795","published":"2026-08-10","topic":"Regulatory enforcement","urgency":4,"quality":3,"status":"new","updateOf":null,"summary":"The Second Authority council deferred enforcement of Channel 14's legal obligation to broadcast news from Jerusalem, granting a further reprieve until either Minister Karhi's communications law takes effect or end of August 2026 — whichever comes first — even though the channel's exemption period expired in February 2026."}],"summaries":{"2026-08-12":{"overall":"A freedom-of-information revelation that Second Authority regulator Yoni Shemoni secretly met Communications Minister Kara'i twice after his appointment — while publicly denying contact — sharply escalates the Mirilashvili cross-ownership standoff into a full regulatory-independence crisis. On the Graham sanctions front, a bipartisan House companion bill was introduced during recess, but Trump's Iran tariff demand poses a critical obstacle to the two-thirds threshold needed, while the SC special primary runoff leaves Graham's Senate legacy seat unsettled until Aug. 25. Romania's Georgescu coup-plot file has formally returned to the Bucharest Court of Appeal for scheduling, and Newsweek's opinion calling on Washington to defend Georgescu's voters signals growing Western media attention to the annulment controversy.","perProject":{"Mirilashvili":"FOI documents reveal Kara'i appointee Shemoni held two undisclosed post-appointment meetings with the minister while publicly denying contact, triggering serious regulator-independence questions. The story leads Israeli front pages for a fourth consecutive day with no Second Authority ruling in sight.","Channel 14 (Israel)":"Quiet day.","Kazakhstan":"Quiet day.","Amadea Yacht":"Quiet day.","Calin Georgescu":"The Georgescu-Potra coup-attempt dossier has formally returned to the Bucharest Court of Appeal for merits-hearing scheduling following the ICCJ's Aug. 6 definitive ruling. A Newsweek opinion piece urging Washington to defend Georgescu's voters marks a notable escalation in Western media coverage of Romania's election annulment dispute.","Abdulaziz Kamilov":"Quiet day.","Morgan Ortagus":"A bipartisan House group introduced a companion to the Senate-passed Graham sanctions bill on Aug. 10, accelerating fall-vote momentum, but Trump's demand to attach Iran tariff authority is the central obstacle to the two-thirds majority needed under suspension rules. The Aug. 25 SC runoff between Darline Graham and Ralph Norman leaves Graham's Senate seat — and the bill's Senate championship — unresolved.","Charles Kushner":"Quiet day.","Alex Spiro":"Quiet day."}}},"lastScan":"2026-09-02T04:06:13.988Z","projects":[{"id":"p-mirilashvili","name":"Mirilashvili"},{"id":"p-channel14","name":"Channel 14 (Israel)"},{"id":"p-kazakhstan","name":"Kazakhstan"},{"id":"p-amadea","name":"Amadea Yacht"},{"id":"p-georgescu","name":"Calin Georgescu"},{"id":"p-kamilov","name":"Abdulaziz Kamilov"},{"id":"p-ortagus","name":"Morgan Ortagus"},{"id":"p-kushner","name":"Charles Kushner"},{"id":"p-spiro","name":"Alex Spiro"}]};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date().toISOString().slice(0,10);
let view=null,fp="all",fs="all",sort="urgency";
const dates=[...new Set(DATA.articles.map(a=>a.scanDate))].sort().reverse();
view=dates[0]||today;
const ls=document.getElementById("lastscan");
ls.textContent="last scan: "+(DATA.lastScan?new Date(DATA.lastScan).toLocaleString():"never");
const fProj=document.getElementById("fProj");
DATA.projects.forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=p.name;fProj.appendChild(o)});
function label(d){const t=new Date().toISOString().slice(0,10);const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 if(d===t)return"Today";if(d===y)return"Yesterday";return new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function render(){
 const tabs=document.getElementById("tabs");tabs.innerHTML="";
 dates.forEach(d=>{const b=document.createElement("button");b.className="day"+(view===d?" on":"");
  b.innerHTML=esc(label(d))+' <span style="opacity:.55">'+DATA.articles.filter(a=>a.scanDate===d).length+"</span>";
  b.onclick=()=>{view=d;render()};tabs.appendChild(b)});
 const all=document.createElement("button");all.className="day"+(view==="all"?" on":"");all.textContent="All days";
 all.onclick=()=>{view="all";render()};tabs.appendChild(all);
 const dg=view==="all"?DATA.summaries[dates.find(d=>DATA.summaries[d])]:DATA.summaries[view];
 const dp=document.getElementById("digestPanel");
 if(dg){dp.style.display="";document.getElementById("dtitle").textContent="DAILY DIGEST — "+(view==="all"?dates.find(d=>DATA.summaries[d]):view);
  document.getElementById("doverall").textContent=dg.overall||"";
  document.getElementById("dgrid").innerHTML=Object.entries(dg.perProject||{}).map(([n,t])=>'<div class="dcard"><div class="dname">'+esc(n)+"</div>"+esc(t)+"</div>").join("")}
 else dp.style.display="none";
 let f=view==="all"?DATA.articles:DATA.articles.filter(a=>a.scanDate===view);
 if(fp!=="all")f=f.filter(a=>a.projectId===fp);
 if(fs!=="all")f=f.filter(a=>a.status===fs);
 f=[...f].sort((x,y)=>sort==="urgency"?y.urgency-x.urgency||y.quality-x.quality:sort==="quality"?y.quality-x.quality||y.urgency-x.urgency:(y.published||"").localeCompare(x.published||""));
 document.getElementById("feed").innerHTML=f.length?f.map(a=>
  '<article class="card"><div class="urg">'+[5,4,3,2,1].map(n=>'<div class="useg" style="background:'+(n<=a.urgency?(a.urgency>=4?"var(--dng)":"var(--sig)"):"var(--line)")+'"></div>').join("")+"</div>"+
  '<div style="flex:1;min-width:0"><div class="meta"><span class="badge" style="background:'+(a.status==="new"?"var(--ok)":"var(--upd)")+'">'+(a.status==="new"?"NEW":"UPDATE")+"</span>"+
  '<span class="tag">'+esc(a.topic)+'</span><span class="mm">'+esc(a.projectName)+'</span><span class="mm">'+esc(a.published)+"</span>"+(view==="all"?'<span class="mm">filed '+esc(a.scanDate)+"</span>":"")+"</div>"+
  "<h2>"+(a.url?'<a href="'+esc(a.url)+'" target="_blank" rel="noreferrer">'+esc(a.title)+"</a>":esc(a.title))+"</h2>"+
  (a.status==="update"&&a.updateOf?'<div class="upof">&#8627; develops: '+esc(a.updateOf)+"</div>":"")+
  '<p class="sum">'+esc(a.summary)+'</p><div class="foot"><span style="font-weight:600">'+esc(a.source)+'</span><span style="color:var(--soft)">source quality</span>'+
  '<span class="q">'+"&#9679;".repeat(a.quality)+'<span class="off">'+"&#9679;".repeat(5-a.quality)+"</span></span></div></div></article>").join("")
  :'<div class="empty">Nothing filed on this day.</div>'}
fProj.onchange=e=>{fp=e.target.value;render()};
document.getElementById("fStatus").onchange=e=>{fs=e.target.value;render()};
document.getElementById("fSort").onchange=e=>{sort=e.target.value;render()};
render();
</script></body></html>
